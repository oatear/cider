<div class='scale-wrapper' [style.width]="scale !== 1.0 && initialWidth ? initialWidth * scale + 'px': 'initial'"
  [style.height]="scale !== 1.0 && initialHeight ? initialHeight * scale + 'px': 'initial'" [class.tiltable]="tiltable">
  @if (cache && cachedImageUrl) {
  <div class="card-preview" [style.transform]="'scale(' + scale + ')'">
    <div class="image-placeholder" [style.width.px]="initialWidth" [style.height.px]="initialHeight">
      <img [src]="cachedImageUrl | safeUrl">
    </div>
  </div>
  }
  @if (!(cache && cachedImageUrl)) {
  <div [style.transform]="'scale(' + scale + ')'" class="card-preview card-{{uuid}}{{lowInk ? ' low-ink' : ''}}">
    <div #cardElement class="card-element" [innerHtml]="template | cardToHtml: card: assetUrls: uuid: version"></div>
    @if (holographic) {
    <div class="holo-overlay"></div>
    }
    @if (showTrimLines) {
    <div class="guide-line trim-line" [style.top.px]="trimOffsetPx" [style.bottom.px]="trimOffsetPx"
      [style.left.px]="trimOffsetPx" [style.right.px]="trimOffsetPx"></div>
    }
    @if (showSafeLines) {
    <div class="guide-line safe-line" [style.top.px]="safeOffsetPx" [style.bottom.px]="safeOffsetPx"
      [style.left.px]="safeOffsetPx" [style.right.px]="safeOffsetPx"></div>
    }
  </div>
  }
</div>
